<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Capacitação SABE 2025</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e8e8e8;
    }
    .page {
      text-align: center;
      padding: 3rem 2rem;
      max-width: 480px;
      width: 100%;
    }
    .logo {
      height: 72px;
      width: auto;
      margin-bottom: 2rem;
    }
    h1 {
      font-size: 1.1rem;
      font-weight: 400;
      color: #555;
      line-height: 1.4;
      margin-bottom: 0.4rem;
    }
    h2 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #111;
      margin-bottom: 2.5rem;
      line-height: 1.2;
    }
    .btn {
      display: inline-block;
      background: #111;
      color: #fff;
      text-decoration: none;
      padding: 0.95rem 2.5rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      transition: background 0.2s;
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    }
    .btn:hover { background: #333; }
  </style>
</head>
<body>
  <div class="page">
    <img src="brasao_estado.png" alt="Estado da Bahia – Secretaria da Educação" class="logo"/>
    <h1>Capacitação para Equipe de Campo</h1>
    <h2>SABE 2025</h2>
    <a href="formulario-capacitacao.html" class="btn">Acessar Formulário de Inscrição</a>
  </div>
</body>
</html>
